<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無限出句 · Seven Steps</title>
<style>
  :root { --bg:#f6f1e7;--surface:#fffbf2;--ink:#1f2a2e;--ink-soft:#5a6a72;--ink-faint:#8c98a0; --accent:#0f6b66;--warm:#c77f3b;--line:#e0d6c2;--danger:#b3402a; }
  body.dark { --bg:#0e1116;--surface:#161b22;--ink:#e6edf3;--ink-soft:#b1bac4;--ink-faint:#7d8590; --accent:#4ec9b0;--warm:#e8a87c;--line:#30363d;--danger:#f85149; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .app{max-width:720px;margin:0 auto;padding:24px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--warm));color:#fff;display:grid;place-items:center;font-weight:700}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
  h1{font-size:24px;margin-bottom:6px}
  .lead{color:var(--ink-soft);font-size:14px;margin-bottom:14px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .meta{font-size:12px;color:var(--ink-faint);margin:8px 0}
  .en{font-size:22px;line-height:1.45;font-weight:650;margin:10px 0 14px}
  .zh{color:var(--ink-soft);font-size:15px;border-left:3px solid var(--warm);padding-left:12px;margin-bottom:18px}
  .btn{padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.45}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-warm{background:var(--warm);color:#fff;border-color:var(--warm)}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px}
  .count{margin-top:16px;font-size:12px;color:var(--ink-faint)}
  a.back,a.link{color:var(--accent);text-decoration:none;font-size:13px;font-weight:600}
  .keybox{margin:10px 0 14px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}
  .keybox input{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  .ok{color:#3b7a4f;font-size:12px}
  .err{color:var(--danger);font-size:13px;margin-top:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="brand" href="./"><div class="brand-mark">7</div><div><div>無限出句</div><div style="font-size:12px;color:var(--ink-faint)">免費 LLM</div></div></a>
    <a class="back" href="./">返主頁</a>
  </div>
  <div class="card">
    <h1>免費模型出新句</h1>
    <p class="lead">403 即係呢個免費模型唔肯接。頁面會自動換第二個。OpenRouter 免費 key 或者 Gemini 免費 key 都得。</p>
    <div class="keybox">
      <div class="meta">Key（sk-or-v1-... 或 AIza...）</div>
      <input id="key" type="password" placeholder="OpenRouter 或 Gemini 免費 key">
      <div class="row" style="margin-top:8px">
        <button class="btn" id="save">儲存 key</button>
        <button class="btn" id="clear">刪 key</button>
        <button class="btn" id="reset">清空已用句</button>
        <span class="ok" id="keystat"></span>
      </div>
    </div>
    <div class="meta">通道</div><div class="row" id="providers"></div>
    <div class="meta">題目</div><div class="row" id="topics"></div>
    <div class="meta">長度</div><div class="row" id="lens"></div>
    <div class="meta" id="tag">—</div>
    <div class="en" id="en">撳下一句。</div>
    <div class="zh" id="zh">403 會自動換模型，全部都 403 先用題庫。</div>
    <div class="err" id="err"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="next">下一句</button>
      <button class="btn btn-warm" id="speak">讀出嚟</button>
    </div>
    <div class="count" id="count">已出 0 句</div>
  </div>
</div>
<script>
const TOPICS=[{id:"fle",label:"ICE FLE"},{id:"ise",label:"IStructE"},{id:"slope",label:"斜坡"},{id:"struct",label:"結構"},{id:"mix",label:"全部"}];
const LENS=[{id:"short",label:"短句"},{id:"mid",label:"20-30字"}];
const PROVIDERS=[{id:"auto",label:"自動免費"},{id:"openrouter",label:"OpenRouter 免費"},{id:"gemini",label:"Gemini 免費"}];
const OR_MODELS=["openrouter/free","google/gemma-4-26b-a4b-it:free","nvidia/nemotron-3.5-lightning:free","inclusionai/ling-3.0-flash-sante:free","google/gemma-4-31b-it:free"];
const GEM_MODELS=["gemini-2.5-flash","gemini-2.0-flash","gemini-2.0-flash-lite"];
const KEY_ID="ss.openrouter"; const USED_ID="ss.used.v1"; const PROV_ID="ss.provider";
let topic="fle", len="mid", n=0, provider=localStorage.getItem(PROV_ID)||"auto";
const TOPIC_EN={fle:"ICE FLE Early Warning NEC4 case study first person I",ise:"IStructE two schemes load path transfer plate",slope:"HK slope cracks blocked drain soil nails factor of safety",struct:"retaining wall steel reinforcement cheaper option",mix:"civil structural exam English"};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function loadUsed(){try{return JSON.parse(localStorage.getItem(USED_ID)||"[]")}catch(e){return[]}}
function saveUsed(arr){localStorage.setItem(USED_ID, JSON.stringify(arr.slice(-400)))}
function isUsed(en){return loadUsed().includes(norm(en))}
function markUsed(en){const u=loadUsed(); const k=norm(en); if(!u.includes(k)){u.push(k); saveUsed(u)}}
function key(){return (localStorage.getItem(KEY_ID)||"").trim()}
function keyType(k){ if((k||"").startsWith("AIza")) return "gemini"; if((k||"").startsWith("sk-or")) return "openrouter"; return "unknown" }
function setStat(){const k=key(); const t=k?keyType(k):"none"; document.getElementById("keystat").textContent=k?("已存 "+t):"未有 key"; document.getElementById("key").value=k?"********":""}
const FALLBACK=[
["fle","I write in the first person and apply the answer to the case.","我用第一人稱寫，將答案套入個案。"],
["fle","I do not copy old papers. I use the site facts in every answer.","我唔抄舊卷。每個答案都用地盤事實。"],
["ise","I proposed two distinct and viable schemes for the office building.","我為寫字樓提出兩個唔同可行方案。"],
["slope","I raised the factor of safety to 1.4 by changing the nail grid.","我改土釘網格，將安全系數加到 1.4。"],
["struct","I follow the load from slab to beam to column to the pile cap.","我跟荷載：板到樑到柱到樁帽。"]
];
function fallback(){const bag=FALLBACK.filter(x=>(topic==="mix"||x[0]===topic)&&!isUsed(x[1])); const src=bag.length?pick(bag):pick(FALLBACK); return {en:src[1],zh:src[2],tag:src[0]}}
function parseJson(raw){const t=(raw||"").replace(/```json|```/g,"").trim(); const m=t.match(/\{[\s\S]*\}/); return JSON.parse(m?m[0]:t)}
function prompt(avoid){const words=len==="short"?"8 to 12 words":"20 to 30 words"; return "One new oral sentence for A2-B1 HK civil engineer. JSON only {\"en\":\"\",\"zh\":\"\"}. zh=Cantonese. Topic: "+TOPIC_EN[topic]+". Length: "+words+". First person I. Avoid: "+avoid.join(" | ")}
async function callOpenRouter(mid, avoid, k){
  const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+k,"Content-Type":"application/json","HTTP-Referer":location.origin,"X-Title":"Seven Steps Free"},body:JSON.stringify({model:mid,temperature:1,max_tokens:180,messages:[{role:"user",content:prompt(avoid)}]})});
  const text=await res.text();
  if(!res.ok){ let msg=mid+" "+res.status; try{const j=JSON.parse(text); msg += " " + ((j.error&&j.error.message)||text).slice(0,160)}catch(e){msg += " "+text.slice(0,120)} throw new Error(msg)} 
  const data=JSON.parse(text);
  const raw=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||"";
  const json=parseJson(raw); if(!json.en||!json.zh) throw new Error("格式唔啱"); return {en:json.en,zh:json.zh,tag:topic,via:mid};
}
async function callGemini(mid, avoid, k){
  const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+mid+":generateContent?key="+encodeURIComponent(k),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt(avoid)}]}],generationConfig:{temperature:1,maxOutputTokens:180}})});
  const text=await res.text();
  if(!res.ok){ let msg=mid+" "+res.status; try{const j=JSON.parse(text); msg += " " + ((j.error&&j.error.message)||text).slice(0,160)}catch(e){msg += " "+text.slice(0,120)} throw new Error(msg)}
  const data=JSON.parse(text);
  const raw=((((data.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||"").join("");
  const json=parseJson(raw); if(!json.en||!json.zh) throw new Error("格式唔啱"); return {en:json.en,zh:json.zh,tag:topic,via:mid};
}
async function aiSentence(){
  const k=key(); if(!k) return fallback();
  const avoid=loadUsed().slice(-20);
  const type=keyType(k);
  const errs=[];
  const tryOR=provider!=="gemini" && type!=="gemini";
  const tryGem=provider!=="openrouter" && (type==="gemini" || provider==="gemini" || provider==="auto");
  if(tryOR){
    for(const mid of OR_MODELS){
      try{ const hit=await callOpenRouter(mid,avoid,k); if(!isUsed(hit.en)) return hit; }catch(e){ errs.push(String(e.message||e)) }
    }
  }
  if(tryGem && type==="gemini"){
    for(const mid of GEM_MODELS){
      try{ const hit=await callGemini(mid,avoid,k); if(!isUsed(hit.en)) return hit; }catch(e){ errs.push(String(e.message||e)) }
    }
  }
  throw new Error(errs.slice(0,3).join("\n") || "全部免費模型失敗");
}
function show(hit,src){
  markUsed(hit.en); n+=1; setStat();
  const labels={fle:"ICE FLE",ise:"IStructE",slope:"斜坡",struct:"結構",mix:"全部"};
  document.getElementById("tag").textContent=(labels[hit.tag]||hit.tag)+" · "+src+(hit.via?" · "+hit.via:"");
  document.getElementById("en").textContent=hit.en;
  document.getElementById("zh").textContent=hit.zh;
  document.getElementById("count").textContent="已出 "+n+" 句 · 已鎖 "+loadUsed().length;
}
async function next(){
  const btn=document.getElementById("next"); const err=document.getElementById("err");
  err.textContent=""; btn.disabled=true;
  document.getElementById("en").textContent=key()?"免費模型出緊句...":"題庫出句...";
  try{ show(await aiSentence(), key()?"免費 LLM":"題庫") }
  catch(e){ err.textContent=String(e.message||e)+"\n已轉題庫。403=呢個免費模型而家唔開放，換 key 或用 Gemini。"; show(fallback(),"題庫") }
  btn.disabled=false;
}
function speak(){const text=document.getElementById("en").textContent; if(!window.speechSynthesis)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.92; speechSynthesis.speak(u)}
function chips(el, items, current, onpick){el.innerHTML=""; items.forEach(x=>{const b=document.createElement("button"); b.className="chip"+(current===x.id?" on":""); b.textContent=x.label; b.onclick=()=>onpick(x.id); el.appendChild(b)})}
function render(){
  chips(document.getElementById("topics"), TOPICS, topic, id=>{topic=id; render()});
  chips(document.getElementById("lens"), LENS, len, id=>{len=id; render()});
  chips(document.getElementById("providers"), PROVIDERS, provider, id=>{provider=id; localStorage.setItem(PROV_ID,id); render()});
}
document.getElementById("save").onclick=()=>{const v=document.getElementById("key").value.trim(); if(v&&v!=="********") localStorage.setItem(KEY_ID,v); setStat()};
document.getElementById("clear").onclick=()=>{localStorage.removeItem(KEY_ID); setStat()};
document.getElementById("reset").onclick=()=>{localStorage.removeItem(USED_ID); setStat()};
document.getElementById("next").onclick=next;
document.getElementById("speak").onclick=speak;
if(localStorage.getItem("ss.theme")==="dark") document.body.classList.add("dark");
render(); setStat();
</script>
</body>
</html>
