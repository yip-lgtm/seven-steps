<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無限出句 · 7劍下天山</title>
<style>
  :root { --bg:#f6f1e7;--surface:#fffbf2;--ink:#1f2a2e;--ink-soft:#5a6a72;--ink-faint:#8c98a0; --accent:#0f6b66;--warm:#c77f3b;--line:#e0d6c2;--danger:#b3402a; }
  body.dark { --bg:#0e1116;--surface:#161b22;--ink:#e6edf3;--ink-soft:#b1bac4;--ink-faint:#7d8590; --accent:#4ec9b0;--warm:#e8a87c;--line:#30363d;--danger:#f85149; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .app{max-width:720px;margin:0 auto;padding:24px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--warm));color:#fff;display:grid;place-items:center;font-weight:700}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
  h1{font-size:24px;margin-bottom:6px}
  .lead{color:var(--ink-soft);font-size:14px;margin-bottom:14px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .meta{font-size:12px;color:var(--ink-faint);margin:8px 0}
  .en{font-size:22px;line-height:1.45;font-weight:650;margin:10px 0 14px}
  .zh{color:var(--ink-soft);font-size:15px;border-left:3px solid var(--warm);padding-left:12px;margin-bottom:18px}
  .btn{padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.45}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-warm{background:var(--warm);color:#fff;border-color:var(--warm)}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px}
  .count{margin-top:16px;font-size:12px;color:var(--ink-faint)}
  a.back{color:var(--accent);text-decoration:none;font-size:13px;font-weight:600}
  .keybox{margin:10px 0 14px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}
  .keybox input{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  .ok{color:#3b7a4f;font-size:12px}
  .err{color:var(--danger);font-size:13px;margin-top:8px;white-space:pre-wrap}
  .chunk-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
  .chunk{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;font-family:inherit;max-width:100%}
  .chunk.on{background:var(--accent-soft, #c8e3df);border-color:var(--accent)}
  .chunk .c-en{font-weight:600}
  .chunk .c-zh{display:block;color:var(--ink-soft);font-size:12px;margin-top:4px}
  .chunk-play{margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="brand" href="./"><div class="brand-mark">7</div><div><div>無限出句</div><div style="font-size:12px;color:var(--ink-faint)">7劍下天山 · 免費 LLM</div></div></a>
    <a class="back" href="./">返主頁</a>
  </div>
  <div class="card">
    <h1>免費模型出新句</h1>
    <p class="lead">長句會自動拆成細段，逐段播。撳細段可以單段重聽。推理模型的思考文字會被剝走。亂寫也會抽英文同粵語。全部失敗先用題庫。</p>
    <div class="keybox">
      <div class="meta">Key（sk-or-v1-... 或 AIza...）</div>
      <input id="key" type="password" placeholder="OpenRouter 或 Gemini 免費 key">
      <div class="row" style="margin-top:8px">
        <button class="btn" id="save">儲存 key</button>
        <button class="btn" id="clear">刪 key</button>
        <button class="btn" id="reset">清空已用句</button>
        <span class="ok" id="keystat"></span>
      </div>
    </div>
    <div class="meta">通道</div><div class="row" id="providers"></div>
    <div class="meta">題目</div><div class="row" id="topics"></div>
    <div class="meta">長度</div><div class="row" id="lens"></div>
    <div class="meta" id="tag">—</div>
    <div class="en" id="en">撲下一句。</div>
    <div class="zh" id="zh">免費模型忙就換第二個。</div>
    <div class="chunk-row" id="chunks"></div>
    <div class="chunk-play" id="chunkplay" style="display:none">
      <button class="btn btn-warm" id="playchunk">播呢段</button>
      <button class="btn" id="playall">播成句</button>
    </div>
    <div class="err" id="err"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="next">下一句</button>
      <button class="btn btn-warm" id="speak">讀出嚟</button>
    </div>
    <div class="count" id="count">已出 0 句</div>
  </div>
</div>
<script>
const TOPICS=[{id:"fle",label:"ICE FLE"},{id:"ise",label:"IStructE"},{id:"slope",label:"斜坡"},{id:"struct",label:"結構"},{id:"mix",label:"全部"}];
const LENS=[{id:"short",label:"短句"},{id:"mid",label:"20-30字"}];
const PROVIDERS=[{id:"auto",label:"自動免費"},{id:"openrouter",label:"OpenRouter 免費"},{id:"gemini",label:"Gemini 免費"}];
const OR_MODELS=[
  "nvidia/nemotron-3-super-120b-a12b:free",
  "google/gemma-4-31b-it:free",
  "inclusionai/ling-3.0-flash-sante:free",
  "nvidia/nemotron-3.5-lightning:free"
];
const GEM_MODELS=["gemini-2.5-flash","gemini-2.0-flash","gemini-2.0-flash-lite"];
const KEY_ID="ss.openrouter"; const USED_ID="ss.used.v1"; const PROV_ID="ss.provider";
let topic="fle", len="mid", n=0, provider=localStorage.getItem(PROV_ID)||"auto";
let currentChunks=[];
let currentChunkIdx=0;
const TOPIC_EN={fle:"ICE FLE Early Warning NEC4 case study",ise:"IStructE two schemes load path transfer plate",slope:"slope cracks blocked drain soil nails safety factor",struct:"retaining wall steel cheaper option",mix:"civil structural exam English"};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function loadUsed(){try{return JSON.parse(localStorage.getItem(USED_ID)||"[]")}catch(e){return[]}}
function saveUsed(arr){localStorage.setItem(USED_ID, JSON.stringify(arr.slice(-400)))}
function isUsed(en){return loadUsed().includes(norm(en))}
function markUsed(en){const u=loadUsed(); const k=norm(en); if(!u.includes(k)){u.push(k); saveUsed(u)}}
function key(){return (localStorage.getItem(KEY_ID)||"").trim()}
function keyType(k){ if((k||"").startsWith("AIza")) return "gemini"; if((k||"").startsWith("sk-or")) return "openrouter"; return "unknown" }
function setStat(){const k=key(); document.getElementById("keystat").textContent=k?("已存 "+keyType(k)):"未有 key"; document.getElementById("key").value=k?"********":""}
const FALLBACK=[
["fle","I write in the first person and apply the answer to the case.","我用第一人稱寫，將答案套入個案。"],
["fle","If the contractor is late, I issue an Early Warning under NEC4.","如果承辦商遲咗，我按 NEC4 發早期警告。"],
["ise","I proposed two distinct and viable schemes for the office building.","我為寫字樓提出兩個唔同可行方案。"],
["slope","Blocked drains let water push the soil outward after heavy rain.","排水塞咗，大雨後水推開泥土。"],
["struct","I follow the load from slab to beam to column to the pile cap.","我跟荷載：板到樑到柱到樁帽。"]
];
function fallback(){const bag=FALLBACK.filter(x=>(topic==="mix"||x[0]===topic)&&!isUsed(x[1])); const src=bag.length?pick(bag):pick(FALLBACK); return {en:src[1],zh:src[2],tag:src[0]}}
function cleanLine(s){
  return String(s||"").replace(/^[\"'`*#\-\s]+|[\"'`*#\s]+$/g,"").replace(/^[\{\},]+|[\{\},]+$/g,"").trim();
}
function hasCjk(s){ return /[\u4e00-\u9fff]/.test(s||""); }
function wordCount(s){ return (s||"").trim().split(/\s+/).filter(Boolean).length; }
function stripThink(t){
  return String(t||"")
    .replace(/<think>[\s\S]*?<\/think>/gi," ")
    .replace(/<reasoning>[\s\S]*?<\/reasoning>/gi," ")
    .replace(/```(?:json|text)?/gi," ")
    .trim();
}
function extractPair(raw){
  const t=stripThink(raw);
  if(!t) throw new Error("空回覆");
  const grab=(re)=>{const ms=[...t.matchAll(re)]; if(!ms.length) return ""; return cleanLine(ms[ms.length-1][1]);};
  let en = grab(/\"en\"\s*:\s*\"([^\"\\n]+)/i)
        || grab(/'en'\s*:\s*'([^'\\n]+)/i)
        || grab(/\bEN\s*[:：]\s*(.+)/ig)
        || grab(/English\s*[:：]\s*(.+)/ig)
        || grab(/\*\*EN\*\*\s*[:：]\s*(.+)/ig);
  let zh = grab(/\"zh\"\s*:\s*\"([^\"\\n]+)/i)
        || grab(/'zh'\s*:\s*'([^'\\n]+)/i)
        || grab(/\bZH\s*[:：]\s*(.+)/ig)
        || grab(/中文\s*[:：]\s*(.+)/g)
        || grab(/粵語\s*[:：]\s*(.+)/g)
        || grab(/Cantonese\s*[:：]\s*(.+)/ig);
  if(!en || !zh){
    try{
      const m=t.match(/\{[\s\S]*\}/);
      if(m){ const j=JSON.parse(m[0]); if(j.en) en=en||cleanLine(j.en); if(j.zh) zh=zh||cleanLine(j.zh); }
    }catch(e){}
  }
  if(!en || !zh){
    const lines=t.split(/\n+/).map(x=>cleanLine(x)).filter(Boolean);
    if(!en){
      const cand=lines.filter(x=>!hasCjk(x) && wordCount(x)>=5 && !/^(topic|avoid|reply|output|note)\b/i.test(x));
      if(cand.length) en=cand[cand.length-1];
    }
    if(!zh){
      const cand=lines.filter(x=>hasCjk(x) && x.length>=4);
      if(cand.length) zh=cand[cand.length-1];
    }
  }
  if(en) en=en.replace(/\s*ZH\s*[:：].*$/i,"").trim();
  if(en && zh && hasCjk(en) && !hasCjk(zh)){ const tmp=en; en=zh; zh=tmp; }
  if(en && wordCount(en)>=4){
    if(!zh) zh="（模型冇出中文）";
    return {en, zh};
  }
  throw new Error("格式唔啲");
}
function friendlyErr(s){
  if(/429/.test(s)) return "429 免費額滿，等幾分鐘或換 Gemini key。";
  if(/403/.test(s)) return "403 呢個免費模型而家唔開放。";
  if(/404/.test(s)) return "404 模型 ID 唔見。";
  if(/空回覆/.test(s)) return "模型只出咗思考，已換下一個。";
  if(/格式/.test(s)) return "模型亂寫，已換下一個。";
  return s.slice(0,180);
}
function prompt(avoid){
  const words=len==="short"?"8 to 12":"20 to 30";
  return [
    "After any thinking, output ONLY these two lines and nothing else.",
    "EN: one English sentence of "+words+" words, first person I.",
    "ZH: the same meaning in Cantonese.",
    "Topic: "+TOPIC_EN[topic]+".",
    "Do not number. Do not explain. Avoid: "+avoid.slice(-8).join(" | ")
  ].join("\n");
}
function rawFromOpenRouter(data){
  const msg=(data&&data.choices&&data.choices[0]&&data.choices[0].message)||{};
  const parts=[];
  if(msg.content) parts.push(msg.content);
  if(msg.reasoning) parts.push(msg.reasoning);
  if(Array.isArray(msg.reasoning_details)){
    msg.reasoning_details.forEach(d=>{ if(d&&d.text) parts.push(d.text); });
  }
  return parts.join("\n");
}
async function callOpenRouter(mid, avoid, k){
  const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+k,"Content-Type":"application/json","HTTP-Referer":location.origin,"X-Title":"Seven Swords Practice"},body:JSON.stringify({model:mid,temperature:0.8,max_tokens:900,messages:[{role:"user",content:prompt(avoid)}]})});
  const text=await res.text();
  if(!res.ok){ let msg=mid+" "+res.status; try{const j=JSON.parse(text); msg += " "+((j.error&&j.error.message)||"")}catch(e){} throw new Error(msg)} 
  const data=JSON.parse(text);
  const raw=rawFromOpenRouter(data);
  const json=extractPair(raw); return {en:json.en,zh:json.zh,tag:topic,via:mid};
}
async function callGemini(mid, avoid, k){
  const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+mid+":generateContent?key="+encodeURIComponent(k),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt(avoid)}]}],generationConfig:{temperature:0.8,maxOutputTokens:500}})});
  const text=await res.text();
  if(!res.ok){ let msg=mid+" "+res.status; try{const j=JSON.parse(text); msg += " "+((j.error&&j.error.message)||"")}catch(e){} throw new Error(msg)}
  const data=JSON.parse(text);
  const raw=((((data.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||"").join("");
  const json=extractPair(raw); return {en:json.en,zh:json.zh,tag:topic,via:mid};
}
async function aiSentence(){
  const k=key(); if(!k) return fallback();
  const avoid=loadUsed().slice(-20);
  const type=keyType(k);
  const errs=[];
  const tryOR=provider!=="gemini" && type!=="gemini";
  const tryGem=provider!=="openrouter" && type==="gemini";
  if(tryOR){ for(const mid of OR_MODELS){ try{ const hit=await callOpenRouter(mid,avoid,k); if(!isUsed(hit.en)) return hit; }catch(e){ errs.push(String(e.message||e)) } } }
  if(tryGem){ for(const mid of GEM_MODELS){ try{ const hit=await callGemini(mid,avoid,k); if(!isUsed(hit.en)) return hit; }catch(e){ errs.push(String(e.message||e)) } } }
  throw new Error(errs.map(friendlyErr).slice(0,4).join("\n")||"全部免費模型失敗");
}
function splitChunks(en, zh){
  const enParts=en.split(/\s+(?=(?:I|As|If|When|Because|The|We|He|She|They|It)\b)/).map(s=>s.trim()).filter(Boolean);
  const zhParts=zh.split(/[，。；、]/).map(s=>s.trim()).filter(Boolean);
  const n=Math.max(enParts.length, zhParts.length, 1);
  const out=[];
  for(let i=0;i<n;i++){
    out.push({en:enParts[i]||"", zh:zhParts[i]||""});
  }
  if(out.length===1 && wordCount(en)>10){
    const words=en.split(/\s+/);
    const mid=Math.ceil(words.length/2);
    out[0]={en:words.slice(0,mid).join(" "), zh:zhParts[0]||""};
    out.push({en:words.slice(mid).join(" "), zh:zhParts[1]||""});
  }
  return out;
}
function renderChunks(){
  const box=document.getElementById("chunks");
  const play=document.getElementById("chunkplay");
  box.innerHTML="";
  if(!currentChunks.length){ play.style.display="none"; return; }
  play.style.display="block";
  currentChunks.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="chunk"+(i===currentChunkIdx?" on":"");
    b.innerHTML='<span class="c-en">'+ (c.en||"") +'</span>'+(c.zh?'<span class="c-zh">'+c.zh+'</span>':'');
    b.onclick=()=>{ currentChunkIdx=i; renderChunks(); speakChunk(i); };
    box.appendChild(b);
  });
}
function speakText(text){
  if(!window.speechSynthesis || !text) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=0.9;
  speechSynthesis.speak(u);
}
function speakChunk(i){
  const c=currentChunks[i]; if(!c) return;
  speakText(c.en);
}
function show(hit,src){
  markUsed(hit.en); n+=1; setStat();
  const labels={fle:"ICE FLE",ise:"IStructE",slope:"斜坡",struct:"結構",mix:"全部"};
  document.getElementById("tag").textContent=(labels[hit.tag]||hit.tag)+" · "+src+(hit.via?" · "+hit.via:"");
  document.getElementById("en").textContent=hit.en;
  document.getElementById("zh").textContent=hit.zh;
  document.getElementById("count").textContent="已出 "+n+" 句 · 已鎖 "+loadUsed().length;
  currentChunks=splitChunks(hit.en, hit.zh);
  currentChunkIdx=0;
  renderChunks();
}
async function next(){
  const btn=document.getElementById("next"); const err=document.getElementById("err");
  err.textContent=""; btn.disabled=true;
  document.getElementById("en").textContent=key()?"免費模型出緊句...":"題庫出句...";
  document.getElementById("zh").textContent="";
  document.getElementById("chunks").innerHTML="";
  document.getElementById("chunkplay").style.display="none";
  try{ show(await aiSentence(), key()?"免費 LLM":"題庫") }
  catch(e){ err.textContent=String(e.message||e)+"\n已轉題庫。等幾分鐘再試，或者貼 Gemini key。"; show(fallback(),"題庫") }
  btn.disabled=false;
}
function speak(){const text=document.getElementById("en").textContent; speakText(text)}
function chips(el, items, current, onpick){el.innerHTML=""; items.forEach(x=>{const b=document.createElement("button"); b.className="chip"+(current===x.id?" on":""); b.textContent=x.label; b.onclick=()=>onpick(x.id); el.appendChild(b)})}
function render(){
  chips(document.getElementById("topics"), TOPICS, topic, id=>{topic=id; render()});
  chips(document.getElementById("lens"), LENS, len, id=>{len=id; render()});
  chips(document.getElementById("providers"), PROVIDERS, provider, id=>{provider=id; localStorage.setItem(PROV_ID,id); render()});
}
document.getElementById("save").onclick=()=>{const v=document.getElementById("key").value.trim(); if(v&&v!=="********") localStorage.setItem(KEY_ID,v); setStat()};
document.getElementById("clear").onclick=()=>{localStorage.removeItem(KEY_ID); setStat()};
document.getElementById("reset").onclick=()=>{localStorage.removeItem(USED_ID); setStat()};
document.getElementById("next").onclick=next;
document.getElementById("speak").onclick=speak;
document.getElementById("playchunk").onclick=()=>speakChunk(currentChunkIdx);
document.getElementById("playall").onclick=()=>speakText(document.getElementById("en").textContent);
if(localStorage.getItem("ss.theme")==="dark") document.body.classList.add("dark");
render(); setStat();
</script>
</body>
</html>
