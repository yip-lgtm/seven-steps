name: Daily Clips

on:
  # 00:00 UTC = 08:00 Asia/Hong_Kong
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger for testing or backfill
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate today's 7 clips (AI, with pool fallback)
        id: pick
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const today = new Date().toISOString().slice(0, 10);

          const PROMPT = `Generate exactly 7 short English listening clips for a B1-level (intermediate) language learner.

Each clip should be:
- 80 to 100 words long (count carefully)
- About a personal, everyday topic (daily life, work, family, hobbies, memories, food, travel, health, technology, plans, opinions, weather)
- Written in natural, conversational English — the way a real person would talk, not textbook-style
- Use a mix of tenses (past, present, future) across the 7 clips
- Each clip should have a clear topic and feel like a real person talking about their own life
- Topics across the 7 clips should be different from each other

Output as a JSON object in this exact shape, with no markdown fences and no commentary before or after:
{
  "clips": [
    { "id": "<short-unique-id-1>", "category": "<one-word-category>", "topic": "<short title, 2 to 5 words>", "text": "<the 80 to 100 word clip>" },
    ...6 more entries
  ]
}

Return ONLY the JSON object.`;

          async function generateFromAI() {
            const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}`,
                'Content-Type': 'application/json',
                'HTTP-Referer': 'https://github.com/yip-lgtm/lma-seven-steps',
                'X-Title': 'LMA Seven Steps',
              },
              body: JSON.stringify({
                model: 'openai/gpt-4o-mini',
                messages: [{ role: 'user', content: PROMPT }],
                temperature: 0.9,
                response_format: { type: 'json_object' },
              }),
            });
            if (!res.ok) throw new Error(`OpenRouter HTTP ${res.status}: ${await res.text()}`);
            const data = await res.json();
            const content = data.choices?.[0]?.message?.content;
            if (!content) throw new Error('No content in OpenRouter response');
            const parsed = JSON.parse(content);
            if (!parsed.clips || !Array.isArray(parsed.clips) || parsed.clips.length === 0) {
              throw new Error('Parsed JSON missing clips array');
            }
            // Validate each entry has required fields
            for (const c of parsed.clips) {
              if (!c.id || !c.topic || !c.text) throw new Error('Clip missing required field');
            }
            return { source: 'ai', clips: parsed.clips, usage: data.usage };
          }

          function pickFromPool() {
            const pool = JSON.parse(fs.readFileSync('clips/pool.json', 'utf8'));
            if (!Array.isArray(pool) || pool.length === 0) throw new Error('pool.json empty');
            let h = 0;
            for (const c of today) h = ((h * 31) + c.charCodeAt(0)) | 0;
            const start = ((h % pool.length) + pool.length) % pool.length;
            const N = 7;
            const picked = [];
            for (let i = 0; i < N; i++) picked.push(pool[(start + i) % pool.length]);
            return { source: 'pool', clips: picked };
          }

          (async () => {
            let result;
            if (process.env.OPENROUTER_API_KEY) {
              try {
                result = await generateFromAI();
                console.log(`✓ AI generation: ${result.clips.length} clips, tokens=${result.usage?.total_tokens || '?'}, cost=$${result.usage?.cost?.toFixed(6) || '?'}`);
              } catch (e) {
                console.log(`✗ AI generation failed: ${e.message}`);
                console.log('→ Falling back to static pool');
                result = pickFromPool();
              }
            } else {
              console.log('ℹ No OPENROUTER_API_KEY secret, using static pool');
              result = pickFromPool();
            }

            const out = { date: today, source: result.source, clips: result.clips };
            fs.writeFileSync('clips/today.json', JSON.stringify(out, null, 2));

            console.log(`\nDate: ${today}  Source: ${result.source}  Clips: ${result.clips.length}`);
            console.log('Topics:');
            result.clips.forEach((c, i) => console.log(`  ${i + 1}. ${c.topic} [${c.id}] (${c.text.split(' ').length} words)`));
          })();
          EOF
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "lma-bot"
          git config user.email "lma-bot@users.noreply.github.com"
          git add clips/today.json
          if git diff --staged --quiet; then
            echo "Already up to date for ${{ steps.pick.outputs.today }}, nothing to commit"
            exit 0
          fi
          git commit -m "chore(clips): refresh for ${{ steps.pick.outputs.today }}"
          git push
