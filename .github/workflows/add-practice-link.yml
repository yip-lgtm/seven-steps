name: Add practice link
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-practice-link.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert homepage button
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text()
          needle = '        <button class="btn btn-ghost" id="btn-settings">Settings</button>'
          add = needle + '\n        <a class="btn btn-warm" href="practice.html">無限出句</a>'
          if 'practice.html">無限出句' in html:
              print('already patched')
          elif needle not in html:
              raise SystemExit('anchor missing')
          else:
              p.write_text(html.replace(needle, add, 1))
              print('patched')
          PY
          git config user.name "seven-steps-bot"
          git config user.email "seven-steps-bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo no changes
            exit 0
          fi
          git commit -m "Add unlimited practice button on homepage"
          git push
