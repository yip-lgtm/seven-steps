name: Daily Content

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate today's bilingual clips
        id: pick
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE"
          node scripts/gen-today.cjs

      - name: Commit and push
        run: |
          git config user.name "lma-bot"
          git config user.email "lma-bot@users.noreply.github.com"
          git add clips/today.json
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(clips): bilingual refresh $(date -u +%Y-%m-%d)"
          git push
