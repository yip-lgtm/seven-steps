name: Daily Content

on:
  workflow_dispatch:
  schedule:
    # Four cron triggers across 90 min, HKT 08:00 / 08:30 / 09:00 / 09:30.
    # GitHub Actions' scheduler is known to skip windows under load —
    # observed twice (27 Aug, 1 Sep) over 4 days. Redundancy is the
    # only fix. All four write the same date (server clock inside
    # gen-today.cjs) so they're idempotent. The `concurrency` group
    # below prevents overlapping runs from corrupting the commit.
    - cron: '0 0 * * *'
    - cron: '30 0 * * *'
    - cron: '0 1 * * *'
    - cron: '30 1 * * *'

concurrency:
  group: daily-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate today's bilingual clips
        id: pick
        continue-on-error: true
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if node scripts/gen-today.cjs; then
            echo "::notice::AI generation succeeded"
          else
            rc=$?
            echo "::warning::AI generation failed (exit $rc), falling back to static pool"
            # Build a minimal today.json from the static pool so the app
            # still has SOMETHING to show. Stale, but better than empty.
            node -e '
              const fs = require("fs");
              const today = new Date().toISOString().slice(0, 10);
              const pool = JSON.parse(fs.readFileSync("clips/pool.json", "utf8"));
              const clips = (pool.clips || []).slice(0, 7).map((c, i) => ({
                id: c.id || ("fallback-" + i),
                category: c.category || "general",
                topic_zh: c.topic_zh || c.topic || "",
                topic_en: c.topic_en || c.topic || "",
                text_zh: c.text_zh || "",
                text_en_b1: c.text_en_b1 || c.text_en || "",
                text_en_b2: c.text_en_b2 || c.text_en || "",
                text_en_c1: c.text_en_c1 || c.text_en || "",
                text_en_c2: c.text_en_c2 || c.text_en || "",
                source_url: c.source_url || "",
                source_hint: c.source_hint || "(fallback to static pool — AI gen failed today)",
              }));
              const out = { date: today, source: "pool-fallback", persona: "wsb", clips };
              fs.writeFileSync("clips/today.json", JSON.stringify(out, null, 2));
              console.log("Wrote fallback today.json with " + clips.length + " clips from pool.json");
            '
          fi

      - name: Generate today's audio (TTS via MiniMax)
        if: success()
        continue-on-error: true
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE"
          node scripts/gen-audio.cjs

      - name: Prune audio older than 14 days
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          # Keep audio/{today-N} directories up to 14 days old. Prune the rest.
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-14d +%Y-%m-%d)
          for d in audio/20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]; do
            [ -d "$d" ] || continue
            date_part=$(basename "$d")
            if [ "$date_part" \< "$cutoff" ]; then
              echo "  pruning $d (older than $cutoff)"
              rm -rf "$d"
            fi
          done
          # Rebuild index.json without pruned dates
          if [ -f audio/index.json ]; then
            node -e '
              const fs = require("fs");
              const idx = JSON.parse(fs.readFileSync("audio/index.json", "utf8"));
              const kept = (idx.dates || []).filter(d => !d.startsWith("20") || d >= "'"$cutoff"'");
              if (kept.length !== (idx.dates || []).length) {
                idx.dates = kept;
                idx.latest = kept[kept.length - 1] || null;
                fs.writeFileSync("audio/index.json", JSON.stringify(idx, null, 2));
                console.log("  updated audio/index.json: kept " + kept.length + " dates");
              }
            '
          fi

      - name: Commit and push
        run: |
          set +e
          git config user.name "seven-steps-bot"
          git config user.email "seven-steps-bot@users.noreply.github.com"
          git add clips/today.json audio/ recordings/ .gitignore
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(clips): bilingual refresh + audio $(date -u +%Y-%m-%d)"
          # Retry push up to 3 times — if another bot run beat us to
          # the commit (concurrency-group above prevents simultaneous
          # runs, but an external push is still possible), pull
          # --rebase and try again. Track success in a flag so the
          # step exits 0 when at least one push succeeded.
          pushed=0
          for attempt in 1 2 3; do
            if git push; then
              pushed=1
              break
            fi
            echo "  push attempt $attempt failed, pulling and retrying"
            git -c http.sslVerify=false pull --rebase origin main || true
            sleep 5
          done
          if [ "$pushed" -eq 0 ]; then
            echo "  ERROR: all 3 push attempts failed"
            exit 1
          fi

      - name: Send Telegram digest
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set, skipping broadcast."
            exit 0
          fi
          node scripts/send-telegram.cjs
